seed: 13

model:
  name: "Qwen/Qwen2.5-1.5B-Instruct"
  dtype: "float16"
  device: "cuda"
  trust_remote_code: true

data:
  path: "data/diagnostic_100.jsonl"
  max_examples: 100

generation:
  max_new_tokens: 16
  do_sample: false
  temperature: 0.0
  stop_on_newline: true

experiment:
  prompt_format: "plain_rag"
  cache_position_mode: "global"
  budgets: [0.00, 0.05, 0.10, 0.20, 0.30]
  methods:
    - doc_only_naive_global
    - doc_only_naive_local
    - prefix_plus_naive_global
    - prefix_plus_naive_local
    - prefix_conditioned_naive_global
    - prefix_conditioned_naive_local

risk:
  similarity_backend: "tfidf"
  weights:
    query_similarity: 0.40
    entity_overlap: 0.20
    retrieval_score: 0.15
    boundary_score: 0.10
    cross_doc_dependency: 0.10
    conflict_score: 0.05

recompute:
  selection_unit: "span"
  expand_window_tokens: 4
  allow_budget_overshoot: true
  max_budget_overshoot_ratio: 0.03
